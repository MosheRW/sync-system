# Local development only. It uses the public dev API key from
# config/apps.dev.json and the public dev token secret below, so it binds to
# loopback and sets NODE_ENV=development (outside development and test both
# are refused at startup). See README.md.
services:
  sync-server:
    build:
      context: .
      dockerfile: apps/sync-server/Dockerfile
    image: sync-system/sync-server:dev
    ports:
      # Loopback only (M3); put TLS and a reverse proxy in front for real use.
      - '127.0.0.1:8080:8080'
    volumes:
      - ./config/apps.dev.json:/config/apps.json:ro
    environment:
      SYNC_CONFIG_PATH: /config/apps.json
      NODE_ENV: development
      PORT: '8080'
      HOST: 0.0.0.0
      LOG_LEVEL: info
      # Public development token secret (committed, so never use it for real).
      # A fixed value lets tokens survive a container restart, so restart
      # recovery can be tried locally. Generate a real one with
      # `openssl rand -base64 32`.
      TOKEN_SECRET: dev-only-insecure-token-secret-change-me-please
      MAX_GROUP_SIZE_CEILING: '100'
      MAX_LEADER_UPDATE_RATE_CEILING: '10'
      MAX_MESSAGE_SIZE_CEILING: '16384'
      MAX_APP_CONNECTIONS_CEILING: '10000'
      MAX_CONNECTIONS: '10000'
      MAX_PENDING_HANDSHAKES: '1000'
      MAX_INBOUND_MESSAGES_PER_SECOND: '20'
      MAX_INBOUND_BURST: '40'
      MAX_BUFFERED_BYTES: '262144'
      MAX_SESSION_MINUTES_CEILING: '480'
      INACTIVITY_LIMIT_MINUTES_CEILING: '60'
      TOKEN_REFRESH_ACTIVITIES: '10'
      TOKEN_REFRESH_MIN_SECONDS: '60'
      TOKEN_REFRESH_MAX_SECONDS: '300'
      # Join methods any app may use (A: group + door code, B: code + leader
      # approval, C: alphanumeric code, D: QR ticket). Each app picks its own
      # subset with `joinMethods` in the apps config.
      JOIN_METHODS_ALLOWED: A,B,C,D
      QR_TICKET_SECONDS_CEILING: '3600'
      APPROVAL_TIMEOUT_SECONDS_CEILING: '600'
      # Lifecycle timer ceilings (#13): grace after a leader disconnect or a
      # missed keep-alive, and the keep-alive countdown.
      DISCONNECT_GRACE_SECONDS_CEILING: '120'
      KEEP_ALIVE_COUNTDOWN_SECONDS_CEILING: '120'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # The reading app (#19, #24): a static React app served by a small Node
  # server. Open http://127.0.0.1:8081/ for the library. Every variable is
  # documented in apps/reader/README.md; the values below are the defaults,
  # except the sync settings, which connect it to the sync server above.
  reader:
    build:
      context: .
      dockerfile: apps/reader/Dockerfile
    image: sync-system/reader:dev
    ports:
      # Loopback only; put TLS and a reverse proxy in front for real use
      # (Web Crypto needs HTTPS outside localhost).
      - '127.0.0.1:8081:8080'
    environment:
      PORT: '8080'
      HOST: 0.0.0.0
      # library | error | default-book | single-book
      READER_ENTRY: library
      # Required for default-book and single-book, e.g. samples/psalms-he.
      # READER_BOOK: samples/psalms-he
      READER_LIBRARY: 'on'
      READER_UI_LANG: auto
      # Empty: ?src links are disabled. Comma-separated exact origins, e.g.
      # https://content.example.org (http: only for localhost, dev only).
      READER_SRC_ORIGINS: ''
      READER_FETCH_TIMEOUT_SECONDS: '15'
      READER_SRC_MAX_BYTES: '5242880'
      # Groups (#24). The browser connects from the host to the sync server's
      # loopback port, so the URL is the host's address, not the service name.
      # This image runs with NODE_ENV=production, so the reader prints two
      # startup warnings here (ws: and the public dev key): expected locally.
      READER_SYNC_URL: ws://127.0.0.1:8080/ws
      # The public dev key of the `dev-app` entry in config/apps.dev.json. The
      # key ships in every page anyway (it identifies the app, it is not a
      # secret); the sync server accepts this one only in development.
      READER_SYNC_API_KEY: dev-only-insecure-api-key-change-me-please
      # Late-joiner countdown in seconds (0-60, default 10).
      # READER_SYNC_LATE_JOIN_SECONDS: '10'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
