name: CI

on:
  workflow_dispatch:
  # push:
  # pull_request:

# Read-only token, no secrets used anywhere in this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The several-instance suites (#35 PR 2) need more than the old 15.
    timeout-minutes: 25
    steps:
      # Actions are pinned to commit SHAs (L8); the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Redis for the *.redis.test.ts suites (#35 AC31, security F15): pinned
      # by digest, a CI-only password (not a secret), no persistence, bound to
      # loopback. Started here because a services container cannot take the
      # server flags.
      - name: Start Redis
        run: >-
          docker run -d --name ci-redis -p 127.0.0.1:6379:6379
          redis:7.2.17-alpine@sha256:2f66de68111e64c3927859f158f8e666066dae2b97d9f82770a6f37a5aa1c335
          redis-server --requirepass ci-only-redis-password --save "" --appendonly no
          --maxmemory-policy noeviction

      - name: Audit (high and critical)
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          # redis-required.test.ts fails the run if this is missing (AC31).
          CI: 'true'
          SYNC_TEST_REDIS_URL: redis://:ci-only-redis-password@127.0.0.1:6379

      # The compose files stay valid (#35 AC23, AC31): the default, the Redis
      # override and the two-instance example.
      - name: Compose files
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml -f compose.redis.yaml config -q
          docker compose -f compose.yaml -f compose.redis.yaml -f compose.multi.yaml config -q

      - name: Build
        run: pnpm build

      # The three published packages (#37 AC50, AC51): tarball contents and
      # packed manifests, then a clean install with --ignore-scripts and the
      # lockfile's exact react versions (import, types, SSR render).
      - name: Pack check
        run: pnpm pack:check

      - name: Smoke test
        run: pnpm smoke

  # The reader's browser checks against the real sync server (#24, ADR 0008).
  # Same pinned actions, read-only token and no secrets as `check`. Only the
  # committed dev key and a per-run random token secret are used; servers bind
  # 127.0.0.1. Nothing is uploaded: Playwright's output can show codes (L5).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm --filter @mosherw/sync-system-reader exec playwright install --with-deps chromium

      - name: End-to-end checks
        run: pnpm --filter @mosherw/sync-system-reader test:e2e
