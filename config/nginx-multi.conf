# Dev-only load balancer for compose.multi.yaml (#35 AC23): round robin over
# the two sync server instances, no sticky sessions (no ip_hash or hash), and
# the WebSocket upgrade. Nothing is logged per request.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream sync_servers {
  server sync-server:8080;
  server sync-server-2:8080;
}

server {
  listen 8080;
  access_log off;

  location / {
    proxy_pass http://sync_servers;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Above the server's 30 s heartbeat, so idle sockets stay open.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}
